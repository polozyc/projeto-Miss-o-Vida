name: Deploy frontend no GitHub Pages

# Roda automaticamente a cada push na branch principal, ou manualmente
# pela aba "Actions" do repositório.
on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: frontend
        run: npm install

      - name: Build do frontend
        working-directory: frontend
        env:
          # Nome do repositório, usado como "base path" do site
          # (https://usuario.github.io/NOME-DO-REPO/).
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # URL da API do backend. Configure em:
          # Settings > Secrets and variables > Actions > Variables > VITE_API_URL
          # Enquanto o backend não estiver hospedado, o site funciona só
          # como "vitrine": formulários e painel admin não vão responder.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:4000/api' }}
        run: |
          # O Content-Security-Policy (connect-src) do index.html precisa só da
          # origem (esquema+host), sem o path "/api" — um CSP com path restringe
          # a requisição àquele path EXATO, bloqueando "/api/certificados" etc.
          export VITE_API_ORIGIN=$(node -e "console.log(new URL(process.env.VITE_API_URL).origin)")
          npm run build

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
