version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: missaovida_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-missaovida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missaovida123}
      POSTGRES_DB: ${POSTGRES_DB:-missaovida_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missaovida} -d ${POSTGRES_DB:-missaovida_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - missaovida_net

  backend:
    build:
      context: ./backend
    container_name: missaovida_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-missaovida}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-missaovida123}
      DB_NAME: ${POSTGRES_DB:-missaovida_db}
      JWT_SECRET: ${JWT_SECRET:-troque_esta_chave_em_producao}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - missaovida_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: missaovida_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - missaovida_net

networks:
  missaovida_net:
    driver: bridge

volumes:
  db_data:
  backend_uploads:
