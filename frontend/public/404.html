<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Missão Vida</title>
    <script type="text/javascript">
      // Truque para permitir client-side routing (React Router) no GitHub Pages,
      // que não suporta rewrites de servidor. Baseado em:
      // https://github.com/rafgraph/spa-github-pages
      //
      // pathSegmentsToKeep = 1 -> deploy como "Project Page"
      // (https://usuario.github.io/nome-do-repo/). Se um dia usar domínio próprio
      // ou "User/Org Page" (https://usuario.github.io/), troque para 0.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
