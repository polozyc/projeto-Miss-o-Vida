server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers de segurança
    # ATENÇÃO: troque "api.seudominio.org.br" no connect-src abaixo pelo
    # domínio real da API (mesmo valor usado em API_URL / Caddyfile).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.seudominio.org.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Suporte ao client-side routing do React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache mais agressivo para assets com hash no nome
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
