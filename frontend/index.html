<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ONG Missão Vida - Ação social, esporte e cidadania em Carapicuíba - SP. Junte-se a nós e transforme vidas." />
    <title>Missão Vida | ONG em Carapicuíba - SP</title>
    <!-- Content-Security-Policy via <meta>: no GitHub Pages não dá pra definir
         headers HTTP customizados (X-Frame-Options, HSTS, etc. ficam de fora),
         então isso é a única camada de CSP possível nessa hospedagem.
         %VITE_API_URL% é substituído pelo Vite no build com o valor da env var. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' %VITE_API_URL%; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // Decodifica a URL "escondida" pelo public/404.html, restaurando a rota
      // real antes do React Router assumir. Necessário apenas para hospedagem
      // estática sem suporte a rewrites (ex: GitHub Pages).
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
